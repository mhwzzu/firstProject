services:
  database:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-together_journey}
      POSTGRES_USER: ${POSTGRES_USER:-journey}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Please set POSTGRES_PASSWORD in .env}
    volumes:
      - journey-postgres:/var/lib/postgresql/data
    networks:
      - journey-net

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    depends_on:
      - database
    environment:
      SPRING_PROFILES_ACTIVE: postgres
      DB_URL: jdbc:postgresql://database:5432/${POSTGRES_DB:-together_journey}
      DB_USERNAME: ${POSTGRES_USER:-journey}
      DB_PASSWORD: ${POSTGRES_PASSWORD:?Please set POSTGRES_PASSWORD in .env}
      APP_USERNAME: ${APP_USERNAME:-mhwzzu}
      APP_PASSWORD: ${APP_PASSWORD:?Please set APP_PASSWORD in .env}
      AMAP_KEY: ${AMAP_KEY:-}
    networks:
      - journey-net

  frontend:
    build:
      context: ./frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${WEB_PORT:-80}:80"
    networks:
      - journey-net

volumes:
  journey-postgres:

networks:
  journey-net:
