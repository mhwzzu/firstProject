server:
  port: 8080
  servlet:
    session:
      cookie:
        http-only: true
        same-site: lax

app:
  auth:
    username: ${APP_USERNAME:mhwzzu}
    password: ${APP_PASSWORD:change-me-now}

amap:
  key: ${AMAP_KEY:}

spring:
  datasource:
    url: jdbc:h2:mem:journey;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;DATABASE_TO_LOWER=TRUE
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false
  jackson:
    time-zone: Asia/Shanghai

---
spring:
  config:
    activate:
      on-profile: postgres
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/together_journey}
    username: ${DB_USERNAME:journey}
    password: ${DB_PASSWORD:journey-local}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
