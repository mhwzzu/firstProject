server:
  port: 8080
  servlet:
    session:
      cookie:
        http-only: true
        same-site: lax
        secure: ${APP_SECURE_COOKIE:false}

amap:
  key: ${AMAP_KEY:}

discovery:
  enabled: ${DISCOVERY_ENABLED:false}
  bocha-api-key: ${BOCHA_API_KEY:}
  bocha-api-base-url: ${BOCHA_API_BASE_URL:https://api.bochaai.com/v1}
  brave-api-key: ${BRAVE_SEARCH_API_KEY:}
  cache-minutes: ${DISCOVERY_CACHE_MINUTES:60}
  result-limit: ${DISCOVERY_RESULT_LIMIT:3}

spring:
  config:
    import: optional:file:../.env.local[.properties],optional:file:.env.local[.properties]
  datasource:
    url: ${DB_URL:jdbc:h2:file:../data/journey;MODE=PostgreSQL;AUTO_SERVER=TRUE;DATABASE_TO_LOWER=TRUE}
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  jackson:
    time-zone: Asia/Shanghai

---
spring:
  config:
    activate:
      on-profile: postgres
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/together_journey}
    username: ${DB_USERNAME:journey}
    password: ${DB_PASSWORD:journey-local}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
